<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lyrigen</title>
    <style>
      body, html, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        color: white;
        /* The theme owns the typeface (Sound Lab → Typeface); this is only the
           fallback for the moment before the stylesheet loads. */
        font-family: var(--ui-font, "Segoe UI Variable Text", "Segoe UI", sans-serif);
      }
    </style>
    <script>
      window.addEventListener('error', function (event) {
        var root = document.getElementById('root')
        if (!root || root.childElementCount > 0) return
        root.innerHTML = '<main style="min-height:100%;display:grid;place-items:center;padding:32px;background:#09090d;color:#fff;font:16px/1.5 Segoe UI,sans-serif"><section style="max-width:560px"><h1 style="font-size:24px;margin:0 0 10px">Lyrigen could not start</h1><p style="color:#bbb;margin:0">' + String(event.message || 'An unexpected startup error occurred.') + '</p></section></main>'
      })
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
